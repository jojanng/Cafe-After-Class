<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#F6F4EE"><title>Café After Class</title>
</head>
<body>
  <main>
    <header class="masthead">
      <h1><span class="cup-mark" aria-hidden="true"></span>Café After Class</h1>
      <nav aria-label="Café books">
        <button data-action="menu">Menu</button><button data-action="pantry">Pantry</button><button data-action="receipts">Receipts</button>
      </nav>
      <button id="demo-toggle">Try 10-second demo</button>
    </header>
    <div class="room-view">
      <canvas id="cafe" role="img" aria-label="Café layout blockout with a curved L counter, staff-facing gray espresso machine on the left, payment terminal at the bend, glass pastry case along the right return and a money tree by the right window."></canvas>
      <p id="fallback" hidden>This café scene needs a browser with WebGL enabled.</p>
    </div>
    <div class="service-desk">
      <p id="demo-note" class="demo-mode" hidden>10-second demo · temporary progress</p>
      <section id="play-slip" aria-label="Your order slip" tabindex="-1"></section>
      <p id="notice" role="status" aria-live="polite"></p>
    </div>
    <dialog id="notebook" aria-labelledby="book-title">
      <button id="close-book" aria-label="Close book">Close ×</button><div id="book-content"></div>
    </dialog>
  </main>
  <script type="module" src="/src/main.js"></script>
  <script type="module" src="/src/play.js"></script>
</body>
</html>
